rules:
  - id: bank.python.client-controlled-user-id
    languages: [python]
    severity: ERROR
    message: >-
      Client-controlled X-User-Id is converted directly into the effective user
      identity. This can enable identity spoofing and BOLA/IDOR in dependent endpoints.
    metadata:
      category: security
      confidence: HIGH
      cwe: CWE-287
      owasp: API1:2023
      review: Confirm which endpoints rely on this identity and test cross-user access.
    paths:
      include: [app/security.py]
    pattern: return int(x_user_id)

  - id: bank.python.transfer.balance-read-before-debit
    languages: [python]
    severity: ERROR
    message: >-
      Transfer reads the account balance before a separate debit UPDATE without
      a row lock or atomic balance predicate. Review for race condition/double-spend.
    metadata:
      category: security
      confidence: HIGH
      cwe: CWE-362
      owasp: A04:2021
      review: Confirm transaction isolation and run concurrent transfer tests.
    paths:
      include: [app/crud.py]
    patterns:
      - pattern-inside: |
          async def transfer(...):
            ...
      - pattern: |
          $BAL = await $CONN.fetchval("SELECT balance_cents FROM accounts WHERE id=$1", $FROM)

  - id: bank.python.sql.dynamic-placeholder-fstring-review
    languages: [python]
    severity: INFO
    message: >-
      Review dynamic SQL construction. In this repository the f-string inserts
      only the numeric asyncpg placeholder index; values remain bound through params,
      so this is expected to be a false positive for SQL injection. Do not interpolate
      user-controlled values or SQL identifiers.
    metadata:
      category: security
      confidence: LOW
      cwe: CWE-89
      review: False-positive rationale required; verify placeholder values remain parameterized.
    paths:
      include: [app/crud.py]
    pattern-regex: '(?m)^\s*sql\s*\+=\s*f"[^"\n]*\$\{i\}[^"\n]*"'

  - id: bank.python.redis.cache-hit-returns-empty-list
    languages: [python]
    severity: WARNING
    message: >-
      A Redis cache hit returns an empty list instead of the cached transaction
      value. This can cause incorrect history responses.
    metadata:
      category: correctness
      confidence: HIGH
      cwe: CWE-682
      review: Verify the intended cache serialization and return behavior.
    paths:
      include: [app/crud.py]
    patterns:
      - pattern-inside: |
          async def list_transactions(...):
            ...
      - pattern: |
          if $CACHED:
            return []

  - id: bank.python.redis.cache-invalidation-key-mismatch
    languages: [python]
    severity: WARNING
    message: >-
      Transfer invalidation deletes tx:{user_id}, while history reads use a key
      containing user_id, limit and search. Verify invalidation of all variants.
    metadata:
      category: correctness
      confidence: HIGH
      cwe: CWE-664
      review: Confirm the key format and invalidate sender/recipient history as required.
    paths:
      include: [app/crud.py]
    pattern: await $REDIS.delete(f"tx:{user_id}")

  - id: bank.python.postgres-dsn-direct-environment-read
    languages: [python]
    severity: WARNING
    message: >-
      Database DSN is read directly from os.environ while app configuration also
      defines a Pydantic Settings object. Consolidate configuration sources and
      validate required settings consistently.
    metadata:
      category: maintainability
      confidence: HIGH
      review: Check app/config.py and app/db.py for configuration drift.
    paths:
      include: [app/db.py]
    pattern: 'os.environ["POSTGRES_DSN"]'

  - id: bank.python.transfer-self-transfer-review
    languages: [python]
    severity: INFO
    message: >-
      Review whether the transfer service must reject from_id == to_id. The rule
      flags the debit path only; it does not prove a vulnerability by itself.
    metadata:
      category: security
      confidence: LOW
      review: Business-rule review required; consider service-layer validation and tests.
    paths:
      include: [app/crud.py]
    patterns:
      - pattern-inside: |
          async def transfer(...):
            ...
      - pattern: |
          await $CONN.execute("UPDATE accounts SET balance_cents = balance_cents - $1 WHERE id=$2", $AMOUNT, $FROM)

  - id: bank.python.api-import-name-mismatch-review
    languages: [python]
    severity: ERROR
    message: >-
      app.main imports names that are not declared in app.security/app.schemas in
      the supplied archive. Verify imports before runtime tests; this can prevent startup.
    metadata:
      category: correctness
      confidence: HIGH
      review: Compare imported symbols with declarations in the target modules.
    paths:
      include: [app/main.py]
    pattern-either:
      - pattern: from app.security import user_id
      - pattern: from app.schemas import TransferIn, TxOut

  - id: bank.compose.postgres-default-password
    languages: [yaml]
    severity: ERROR
    message: >-
      PostgreSQL is configured with the well-known development password postgres.
      Use a secret manager and least-privilege credentials.
    metadata:
      category: security
      confidence: HIGH
      cwe: CWE-798
    paths:
      include: [docker-compose.yml]
    pattern: "POSTGRES_PASSWORD: postgres"

  - id: bank.compose.postgres-published-port
    languages: [yaml]
    severity: WARNING
    message: >-
      PostgreSQL host port 5432 is published. Confirm the host firewall restricts
      access; prefer an internal container network without host port publishing.
    metadata:
      category: security
      confidence: HIGH
      cwe: CWE-668
    paths:
      include: [docker-compose.yml]
    pattern-regex: '(?m)^\s*-\s*"5432:5432"\s*$'

  - id: bank.compose.redis-published-port
    languages: [yaml]
    severity: WARNING
    message: >-
      Redis host port 6379 is published. Restrict it to the internal application
      network and do not expose it to untrusted clients.
    metadata:
      category: security
      confidence: HIGH
      cwe: CWE-668
    paths:
      include: [docker-compose.yml]
    pattern-regex: '(?m)^\s*-\s*"6379:6379"\s*$'

  - id: bank.compose.redis-url-no-auth
    languages: [yaml]
    severity: WARNING
    message: >-
      Redis URL contains no username/password and the compose service has no ACL
      setup. Require authentication and network isolation where the service is reachable.
    metadata:
      category: security
      confidence: HIGH
      cwe: CWE-306
    paths:
      include: [docker-compose.yml]
    pattern: "REDIS_URL: redis://redis:6379/0"

  - id: bank.compose.mutable-major-image-tags
    languages: [yaml]
    severity: WARNING
    message: >-
      Container image uses a floating major tag rather than an immutable digest.
      Pin approved image versions/digests and update them through a controlled process.
    metadata:
      category: supply-chain
      confidence: HIGH
      cwe: CWE-829
    paths:
      include: [docker-compose.yml]
    pattern-either:
      - pattern: "image: postgres:16"
      - pattern: "image: redis:7"

  - id: bank.compose.api-published-without-tls-config
    languages: [yaml]
    severity: INFO
    message: >-
      Compose publishes API port 8000 but does not show TLS termination. Confirm
      an external ingress/reverse proxy provides HTTPS in deployed environments.
    metadata:
      category: security
      confidence: MEDIUM
      review: Deployment-level TLS may exist outside this compose file.
    paths:
      include: [docker-compose.yml]
    pattern-regex: '(?m)^\s*-\s*"8000:8000"\s*$'

  - id: bank.python.transfer.target-account-enumeration-review
    languages: [python]
    severity: INFO
    message: >-
      The transfer flow returns a distinct 404 response when the destination account
      does not exist. Review whether this response can be used as an account-existence
      oracle and whether the public API should use a uniform response policy.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: CWE-203
      review: Validate the externally observable behavior and authorization preconditions.
    paths:
      include: [app/crud.py]
    patterns:
      - pattern-inside: |
          async def transfer(...):
            ...
      - pattern: raise HTTPException(status_code=404, detail="To account not found")

  - id: bank.python.api.rate-limit-review
    languages: [python]
    severity: INFO
    message: >-
      Review rate limiting and abuse protection for this public transfer endpoint.
      No rate-limiting control is visible in the supplied route declaration; an API
      gateway or reverse proxy may provide controls outside this repository.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: CWE-770
      review: Verify per-user and per-IP limits, burst controls, monitoring and bypass resistance.
    paths:
      include: [app/main.py]
    pattern-either:
      - pattern: '@app.post("/transfer")'
      - pattern: '@app.get("/transactions")'

  - id: bank.python.transfer.idempotency-review
    languages: [python]
    severity: INFO
    message: >-
      The transfer service signature has no idempotency key. Review retry and
      duplicate-delivery handling so client retries cannot create duplicate transfers.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: CWE-841
      review: Confirm request schema, storage uniqueness and replay behavior end to end.
    paths:
      include: [app/crud.py]
    pattern: |
      async def transfer(user_id: int, from_id: int, to_id: int, amount: int) -> int:
        ...

  - id: bank.python.transfer.audit-attribution-review
    languages: [python]
    severity: INFO
    message: >-
      The transaction INSERT stores account IDs and amount but no explicit initiating
      principal or request correlation ID. Review whether a separate protected audit
      event captures actor attribution and supports non-repudiation investigations.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: CWE-778
      review: Check database schema and external audit pipeline before treating this as a confirmed gap.
    paths:
      include: [app/crud.py]
    pattern-regex: '(?s)INSERT INTO transactions\s*\(from_account_id\s*,\s*to_account_id\s*,\s*amount_cents\)'
